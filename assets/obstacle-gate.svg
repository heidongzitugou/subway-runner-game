<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70" width="80" height="70">
  <defs>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4c4f"/>
      <stop offset="100%" stop-color="#b42d30"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Gate frame - top bar -->
  <rect x="2" y="2" width="76" height="14" rx="4" fill="url(#gateGrad)" stroke="#ff6b6b" stroke-width="2"/>
  <!-- Gate frame - left post -->
  <rect x="2" y="2" width="10" height="66" rx="3" fill="url(#gateGrad)" stroke="#ff6b6b" stroke-width="1.5"/>
  <!-- Gate frame - right post -->
  <rect x="68" y="2" width="10" height="66" rx="3" fill="url(#gateGrad)" stroke="#ff6b6b" stroke-width="1.5"/>
  <!-- Danger warning -->
  <rect x="14" y="8" width="52" height="6" rx="2" fill="#ffd34e" opacity="0.6"/>
  <!-- Stripes -->
  <g opacity="0.2">
    <rect x="14" y="28" width="52" height="3" fill="#fff"/>
    <rect x="14" y="38" width="52" height="3" fill="#fff"/>
    <rect x="14" y="48" width="52" height="3" fill="#fff"/>
    <rect x="14" y="58" width="52" height="3" fill="#fff"/>
  </g>
  <!-- Glow line on top -->
  <rect x="28" y="0" width="24" height="3" rx="1.5" fill="#ffd34e" opacity="0.5" filter="url(#glow)"/>
  <!-- Bollards at bottom -->
  <rect x="16" y="20" width="6" height="48" rx="2" fill="#ff6b6b" opacity="0.4"/>
  <rect x="58" y="20" width="6" height="48" rx="2" fill="#ff6b6b" opacity="0.4"/>
</svg>
