<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68a7ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <circle cx="30" cy="28" r="26" fill="#68a7ff" opacity="0.1" filter="url(#glow)"/>
  <!-- Shield shape -->
  <path d="M30,6 L14,14 L14,30 Q14,44 30,52 Q46,44 46,30 L46,14 Z" fill="url(#shieldGrad)" stroke="#9cc4ff" stroke-width="2" filter="url(#glow)"/>
  <!-- Shield highlight -->
  <path d="M20,24 Q24,18 30,18" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- S letter -->
  <text x="30" y="33" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="middle" opacity="0.9">S</text>
</svg>
