<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="140" height="180">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8efe7"/>
      <stop offset="40%" stop-color="#8eb0a6"/>
      <stop offset="100%" stop-color="#36454b"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162027"/>
      <stop offset="100%" stop-color="#0a1418"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="70" cy="170" rx="65" ry="8" fill="rgba(0,0,0,0.4)"/>
  <!-- Main body -->
  <rect x="8" y="30" width="124" height="140" rx="10" fill="url(#bodyGrad)" stroke="#5a7a72" stroke-width="2"/>
  <!-- Roof -->
  <rect x="8" y="30" width="124" height="20" rx="10" fill="#1f3333"/>
  <!-- Top accent stripe -->
  <rect x="8" y="30" width="124" height="4" rx="2" fill="#68a7ff" opacity="0.6"/>
  <!-- Headlights -->
  <rect x="12" y="52" width="20" height="12" rx="3" fill="#fff4b0" filter="url(#glow)"/>
  <rect x="108" y="52" width="20" height="12" rx="3" fill="#fff4b0" filter="url(#glow)"/>
  <!-- Headlight glow -->
  <rect x="10" y="50" width="24" height="16" rx="4" fill="#ffd34e" opacity="0.15" filter="url(#glow)"/>
  <rect x="106" y="50" width="24" height="16" rx="4" fill="#ffd34e" opacity="0.15" filter="url(#glow)"/>
  <!-- Windshield -->
  <rect x="30" y="50" width="80" height="28" rx="5" fill="url(#windowGrad)" stroke="#2a4440" stroke-width="1.5"/>
  <!-- Windshield reflection -->
  <rect x="35" y="54" width="30" height="4" rx="2" fill="#fff" opacity="0.08"/>
  <!-- Red stripe -->
  <rect x="8" y="110" width="124" height="6" fill="#ef4c4f"/>
  <!-- Number plate -->
  <rect x="48" y="118" width="44" height="14" rx="2" fill="#162027"/>
  <text x="70" y="129" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffd34e" text-anchor="middle" dominant-baseline="middle">SUBWAY</text>
  <!-- Bottom lights -->
  <circle cx="28" cy="150" r="6" fill="#ef4c4f" opacity="0.7" filter="url(#glow)"/>
  <circle cx="112" cy="150" r="6" fill="#ef4c4f" opacity="0.7" filter="url(#glow)"/>
  <!-- Coupler -->
  <rect x="56" y="162" width="28" height="6" rx="2" fill="#2a3838"/>
  <circle cx="70" cy="168" r="4" fill="#555"/>
</svg>
