<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="magGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5be6b7"/>
      <stop offset="50%" stop-color="#ff3b6f"/>
      <stop offset="100%" stop-color="#5be6b7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <circle cx="30" cy="30" r="26" fill="#5be6b7" opacity="0.1" filter="url(#glow)"/>
  <!-- Magnet body -->
  <rect x="18" y="12" width="24" height="16" rx="4" fill="#5be6b7" stroke="#7fffd4" stroke-width="1.5"/>
  <!-- Magnet poles -->
  <rect x="10" y="26" width="8" height="22" rx="3" fill="#ff3b6f" stroke="#ff7d9e" stroke-width="1.2"/>
  <rect x="42" y="26" width="8" height="22" rx="3" fill="#ff3b6f" stroke="#ff7d9e" stroke-width="1.2"/>
  <!-- Magnet curve (U shape) hint -->
  <path d="M14,28 L14,22 Q14,16 18,16" stroke="#5be6b7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M46,28 L46,22 Q46,16 42,16" stroke="#5be6b7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- M letter -->
  <text x="30" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0a2a1f" text-anchor="middle" dominant-baseline="middle">M</text>
  <!-- Magnetic field lines -->
  <path d="M20,10 Q26,6 30,6 Q34,6 40,10" stroke="#5be6b7" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="2,2"/>
  <path d="M22,7 Q26,4 30,4 Q34,4 38,7" stroke="#5be6b7" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="2,2"/>
</svg>
