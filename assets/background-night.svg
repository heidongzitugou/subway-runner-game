<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23313b"/>
      <stop offset="40%" stop-color="#121b21"/>
      <stop offset="100%" stop-color="#071014"/>
    </linearGradient>
    <linearGradient id="tunnelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(4,8,11,0)"/>
      <stop offset="100%" stop-color="rgba(4,8,11,0.55)"/>
    </linearGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Sky background -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="120" cy="35" r="1" opacity="0.8"/>
    <circle cx="280" cy="25" r="0.8" opacity="0.5"/>
    <circle cx="450" cy="45" r="1.2" opacity="0.7"/>
    <circle cx="600" cy="20" r="0.7" opacity="0.4"/>
    <circle cx="750" cy="38" r="1" opacity="0.6"/>
    <circle cx="880" cy="28" r="0.9" opacity="0.5"/>
    <circle cx="350" cy="55" r="0.6" opacity="0.3"/>
    <circle cx="820" cy="50" r="0.8" opacity="0.4"/>
    <circle cx="190" cy="48" r="0.7" opacity="0.5"/>
    <circle cx="530" cy="18" r="0.6" opacity="0.3"/>
  </g>
  <!-- Moon -->
  <circle cx="780" cy="55" r="20" fill="#ffedc4" opacity="0.3" filter="url(#lightGlow)"/>
  <circle cx="780" cy="55" r="14" fill="#ffedc4" opacity="0.5"/>
  <circle cx="786" cy="50" r="2" fill="#ffe082" opacity="0.3"/>
  <!-- City skyline - back row -->
  <g fill="#18242c">
    <rect x="0" y="120" width="60" height="90"/>
    <rect x="65" y="100" width="45" height="110"/>
    <rect x="115" y="130" width="55" height="80"/>
    <rect x="175" y="90" width="35" height="120"/>
    <rect x="215" y="115" width="50" height="95"/>
    <rect x="270" y="105" width="40" height="105"/>
    <rect x="315" y="125" width="65" height="85"/>
    <rect x="385" y="85" width="30" height="125"/>
    <rect x="420" y="110" width="55" height="100"/>
    <rect x="480" y="95" width="40" height="115"/>
    <rect x="525" y="120" width="60" height="90"/>
    <rect x="590" y="80" width="35" height="130"/>
    <rect x="630" y="105" width="50" height="105"/>
    <rect x="685" y="130" width="45" height="80"/>
    <rect x="735" y="95" width="40" height="115"/>
    <rect x="780" y="115" width="55" height="95"/>
    <rect x="840" y="100" width="50" height="110"/>
    <rect x="895" y="125" width="65" height="85"/>
  </g>
  <!-- City skyline - front row (with windows) -->
  <g fill="#1a2c31">
    <rect x="-10" y="140" width="70" height="100"/>
    <rect x="80" y="160" width="50" height="80"/>
    <rect x="145" y="130" width="40" height="110"/>
    <rect x="200" y="150" width="60" height="90"/>
    <rect x="280" y="140" width="45" height="100"/>
    <rect x="340" y="165" width="55" height="75"/>
    <rect x="410" y="135" width="35" height="105"/>
    <rect x="460" y="155" width="50" height="85"/>
    <rect x="530" y="145" width="40" height="95"/>
    <rect x="585" y="160" width="60" height="80"/>
    <rect x="660" y="135" width="45" height="105"/>
    <rect x="720" y="155" width="35" height="85"/>
    <rect x="770" y="140" width="55" height="100"/>
    <rect x="840" y="150" width="60" height="90"/>
    <rect x="910" y="165" width="55" height="75"/>
  </g>
  <!-- Building windows -->
  <g fill="#ffd34e" opacity="0.5">
    <rect x="155" y="142" width="6" height="8" rx="1"/>
    <rect x="155" y="158" width="6" height="8" rx="1"/>
    <rect x="168" y="142" width="6" height="8" rx="1"/>
    <rect x="168" y="158" width="6" height="8" rx="1"/>
    <rect x="210" y="158" width="6" height="8" rx="1"/>
    <rect x="224" y="158" width="6" height="8" rx="1"/>
    <rect x="238" y="158" width="6" height="8" rx="1"/>
    <rect x="290" y="148" width="6" height="8" rx="1"/>
    <rect x="302" y="148" width="6" height="8" rx="1"/>
    <rect x="290" y="164" width="6" height="8" rx="1"/>
    <rect x="420" y="145" width="6" height="8" rx="1"/>
    <rect x="420" y="160" width="6" height="8" rx="1"/>
    <rect x="670" y="145" width="6" height="8" rx="1"/>
    <rect x="670" y="160" width="6" height="8" rx="1"/>
    <rect x="684" y="145" width="6" height="8" rx="1"/>
    <rect x="780" y="150" width="6" height="8" rx="1"/>
    <rect x="800" y="150" width="6" height="8" rx="1"/>
    <rect x="820" y="150" width="6" height="8" rx="1"/>
    <rect x="780" y="165" width="6" height="8" rx="1"/>
  </g>
  <!-- Communication tower -->
  <g stroke="#18242c" stroke-width="2">
    <line x1="620" y1="80" x2="620" y2="45"/>
    <line x1="615" y1="55" x2="625" y2="55"/>
    <line x1="612" y1="65" x2="628" y2="65"/>
  </g>
  <!-- Tunnel vignette -->
  <rect x="0" y="180" width="960" height="460" fill="url(#tunnelGrad)"/>
  <!-- Tunnel arch hints -->
  <g opacity="0.08">
    <path d="M-50,280 Q480,30 1010,280" fill="none" stroke="#b8c1bb" stroke-width="3"/>
    <path d="M-30,250 Q480,10 990,250" fill="none" stroke="#b8c1bb" stroke-width="1.5"/>
  </g>
  <!-- Station lights -->
  <g>
    <circle cx="100" cy="190" r="15" fill="#ffd34e" opacity="0.06" filter="url(#lightGlow)"/>
    <circle cx="300" cy="190" r="15" fill="#ffd34e" opacity="0.06" filter="url(#lightGlow)"/>
    <circle cx="500" cy="190" r="15" fill="#ffd34e" opacity="0.06" filter="url(#lightGlow)"/>
    <circle cx="700" cy="190" r="15" fill="#ffd34e" opacity="0.06" filter="url(#lightGlow)"/>
    <circle cx="900" cy="190" r="15" fill="#ffd34e" opacity="0.06" filter="url(#lightGlow)"/>
  </g>
  <!-- Ground/rail area -->
  <rect x="0" y="280" width="960" height="360" fill="#0a161c" opacity="0.5"/>
</svg>
